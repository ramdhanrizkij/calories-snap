<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6762F5" />
      <stop offset="55%" stop-color="#5B52E5" />
      <stop offset="100%" stop-color="#473DC8" />
    </linearGradient>

    <!-- Calorie Flame / Energy Gradient -->
    <linearGradient id="flameGrad" x1="0" y1="100%" x2="0" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Lens Gradient -->
    <linearGradient id="lensGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Sparkle / Ray Gradient -->
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="20.48" y="20.48" width="471.04" height="471.04" rx="103.6288" fill="url(#bgGrad)" />
         <rect x="21.48" y="21.48" width="469.04" height="469.04" rx="102.6288" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Content Group Scaled to fit safe area -->
  <g transform="translate(256, 256) scale(1.1776) translate(-200, -200)">

    <!-- Top-Right Snap Sparkle Rays -->
    <g id="sparkles">
      <!-- Star 1 -->
      <path d="M295 85 L300 97 L312 100 L300 103 L295 115 L290 103 L278 100 L290 97 Z" fill="url(#sparkleGrad)" />
      <!-- Star 2 Small -->
      <circle cx="330" cy="116" r="4.5" fill="#FEF08A" />
      <!-- Flash rays -->
      <line x1="272" y1="75" x2="284" y2="60" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round" />
      <line x1="318" y1="80" x2="334" y2="72" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Camera Body Top Notch -->
    <path d="M152 142 C152 133 159 126 168 126 L232 126 C241 126 248 133 248 142 L254 158 L146 158 Z" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Main Camera Outer Box -->
    <rect x="88" y="152" width="224" height="168" rx="38" fill="#FFFFFF" />

    <!-- Left Flash sensor -->
    <circle cx="128" cy="186" r="9" fill="#E2E8F0" />
    <circle cx="128" cy="186" r="5" fill="#94A3B8" />

    <!-- Red recording/active sensor dot -->
    <circle cx="272" cy="186" r="7" fill="#EF4444" />

    <!-- Outer Lens Ring -->
    <circle cx="200" cy="240" r="58" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3" />

    <!-- Lens Barrel (Dark Deep Space) -->
    <circle cx="200" cy="240" r="48" fill="url(#lensGrad)" />

    <!-- Lens Subtle Accent Ring -->
    <circle cx="200" cy="240" r="40" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

    <!-- Calorie Flame inside lens -->
    <g transform="translate(200, 240) scale(1.18) translate(-20, -23)">
      <!-- Flame Path -->
      <path d="M20 2 C20 2 24 10 24 16 C24 18.2 23.2 20.3 21.8 21.8 C21.4 22.2 20.8 21.9 20.8 21.3 C20.8 19 19.5 17 17.5 16 C17.5 19 16 21 13.5 22.5 C10.5 24.3 8 27.5 8 31 C8 37.6 13.4 43 20 43 C26.6 43 32 37.6 32 31 C32 23 26 15 20 2 Z" fill="url(#flameGrad)" />
      <!-- Inner Flame Core (Bright yellow) -->
      <path d="M20 24 C19 27 15 28.5 15 32 C15 34.8 17.2 37 20 37 C22.8 37 25 34.8 25 32 C25 28 21 25.5 20 24 Z" fill="#FEF08A" />
    </g>

    <!-- Glass reflection arc -->
    <path d="M106 162 C98 162 92 168 92 176 L92 195 Q145 174 200 174 Q255 174 308 195 L308 176 C308 168 302 162 294 162 Z" fill="white" fill-opacity="0.35" />
    <path d="M172 214 A 36 36 0 0 1 228 214 A 36 32 0 0 0 172 214" fill="white" fill-opacity="0.35" />
  </g>
</svg>